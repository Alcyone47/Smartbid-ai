[project]
name = "smartbid-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "rapidfuzz>=3.10",
    "openpyxl>=3.1",
    "weasyprint>=63.1",
    "anthropic>=0.40",
    "voyageai>=0.3",
    "supabase>=2.10",
    "httpx>=0.28",
    "pyjwt>=2.10",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
