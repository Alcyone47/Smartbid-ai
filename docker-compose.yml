services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Override the host-oriented values from .env for the Docker network.
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    command: ["api"]

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: ["worker"]

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time. The browser talks to the backend
        # via the host-published port, so localhost:8000 is correct.
        VITE_API_BASE_URL: http://localhost:8000
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  redis-data:
